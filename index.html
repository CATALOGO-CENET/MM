<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Diplomas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="container">
    <h1>Generador de Diplomas</h1>
    <form id="diplomaForm">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="curso">Curso:</label>
      <input type="text" id="curso" name="curso" required>

      <label for="fecha">Fecha:</label>
      <input type="date" id="fecha" name="fecha" required>

      
  <label for="estilo">Estilo del Diploma:</label>
  <select id="estilo" name="estilo" required>
    <option value="1">Estilo Clásico</option>
    <option value="2">Estilo Moderno</option>
    <option value="3">Estilo Creativo</option>
  </select><br><br>

      <button type="button" onclick="generarDiploma()">Generar Diploma</button>
    </form>
    <canvas id="qrCanvas" style="display: none;"></canvas>
  </div>
  <div id="previewQR"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="principal.js"></script>
</body>
</html>
